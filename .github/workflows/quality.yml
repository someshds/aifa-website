name: Website quality
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so regenerate_sitemap.py can read git lastmod dates.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run sitemap && git diff --exit-code sitemap.xml
      - run: npm test
      - run: npm run test:lighthouse
